name = "eve-trader-watcher"
main = "worker.js"
compatibility_date = "2024-09-23"

# Check courier contracts every 10 minutes.
[triggers]
crons = ["*/10 * * * *", "0 13 * * *"]   # every 10 min checks; daily summary at 8:00 AM Eastern

# Same KV namespace that the eve-trader Pages project binds as WATCH.
# Create it with:  npx wrangler kv namespace create WATCH   and paste the id below.
[[kv_namespaces]]
binding = "WATCH"
id = "3372e1beeabe4ee2a4ef1ab40aabf101"

# Cloud history database. Create with:  npx wrangler d1 create eve-trader   and paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "eve-trader"
database_id = "7d901161-e09c-4d26-baef-a2e2c156cf4f"

[vars]
EVE_CLIENT_ID = "d2d220b6f3734981ae7fdceeb8bcfde7"
# Courier contract Discord alerts (picked up / delivered / failed): "off" or "on".
# Wallet copies, hauling costs, undercut alerts and the daily summary keep running either way.
COURIER_ALERTS = "off"
